# Caddy route for the HiBeam Homelab Agent. Paste inside your site block, e.g.
#   example.com {
#       ...
#   }
# HiBeam then uses https://example.com/hibeam-agent/metrics with the agent token.
# Caddy redacts the Authorization header in its access logs by default.

handle_path /hibeam-agent/* {
	reverse_proxy 127.0.0.1:9480
}
