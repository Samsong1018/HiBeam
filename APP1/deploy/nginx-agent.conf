# nginx location block for the HiBeam Homelab Agent.
# Drop inside your existing HTTPS server { } block. HiBeam then uses e.g.
#   https://your-domain.example/hibeam-agent/metrics
# with the agent token as the source's bearer token.

location /hibeam-agent/ {
    proxy_pass http://127.0.0.1:9480/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 10s;

    # Keep the agent's own polling out of the access log it serves.
    access_log off;

    limit_except GET { deny all; }
}
